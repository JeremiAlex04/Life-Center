<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Paciente - LifeCenter</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/lifecenter.css}">
</head>

<body style="background:url('/img/fondo_inicio.jpg'); background-size: cover; background-attachment: fixed; background-position: center;">
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <i class="bi bi-heart-pulse me-2 fs-4 text-primary"></i>
                <span class="fs-4 fw-bold">LifeCenter</span>
            </a>
            <a th:href="@{/login}" class="btn btn-outline-primary">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesion
            </a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-xl-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-primary text-white text-center py-3 border-0">
                        <i class="bi bi-person-plus-fill" style="font-size: 2.5rem;"></i>
                        <h1 class="h4 mt-2 mb-1 fw-bold">Crear cuenta de paciente</h1>
                        <p class="mb-0 small">Complete sus datos para acceder al portal</p>
                    </div>

                    <div class="card-body p-3 p-md-4">
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form id="registroForm" th:action="@{/registro}" th:object="${paciente}" method="post" novalidate>
                            <div class="mb-3">
                                <h6 class="mb-2 d-flex align-items-center">
                                    <i class="bi bi-person-fill text-primary me-2"></i>
                                    Datos personales
                                </h6>
                                <div class="row g-2">
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control form-control-sm" id="nombres" th:field="*{nombres}" placeholder="Nombres" required>
                                            <label for="nombres">Nombres</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control form-control-sm" id="apellidos" th:field="*{apellidos}" placeholder="Apellidos" required>
                                            <label for="apellidos">Apellidos</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="date" class="form-control form-control-sm" id="fechaNacimiento" th:field="*{fechaNacimiento}" required>
                                            <label for="fechaNacimiento">Fecha de nacimiento</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <select id="genero" class="form-select form-select-sm" th:field="*{genero}" required>
                                                <option value="" disabled selected>Seleccione genero</option>
                                                <option value="Masculino">Masculino</option>
                                                <option value="Femenino">Femenino</option>
                                                <option value="Otro">Otro</option>
                                            </select>
                                            <label for="genero">Genero</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <h6 class="mb-2 d-flex align-items-center">
                                    <i class="bi bi-telephone-fill text-primary me-2"></i>
                                    Datos de contacto
                                </h6>
                                <div class="row g-2">
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <input type="tel" class="form-control form-control-sm" id="telefono" th:field="*{telefono}" placeholder="Telefono" required>
                                            <label for="telefono">Telefono</label>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <input type="text" class="form-control form-control-sm" id="direccion" th:field="*{direccion}" placeholder="Direccion" required>
                                            <label for="direccion">Direccion</label>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <select id="distrito" class="form-select form-select-sm" th:field="*{distrito}" required>
                                                <option value="" disabled selected>Seleccione un distrito</option>
                                                <option value="Ancon">Ancon</option>
                                                <option value="Ate">Ate</option>
                                                <option value="Barranco">Barranco</option>
                                                <option value="Brena">Brena</option>
                                                <option value="Carabayllo">Carabayllo</option>
                                                <option value="Cercado de Lima">Cercado de Lima</option>
                                                <option value="Chaclacayo">Chaclacayo</option>
                                                <option value="Chorrillos">Chorrillos</option>
                                                <option value="Cieneguilla">Cieneguilla</option>
                                                <option value="Comas">Comas</option>
                                                <option value="El Agustino">El Agustino</option>
                                                <option value="Independencia">Independencia</option>
                                                <option value="Jesus Maria">Jesus Maria</option>
                                                <option value="La Molina">La Molina</option>
                                                <option value="La Victoria">La Victoria</option>
                                                <option value="Lince">Lince</option>
                                                <option value="Los Olivos">Los Olivos</option>
                                                <option value="Lurigancho">Lurigancho</option>
                                                <option value="Lurin">Lurin</option>
                                                <option value="Magdalena del Mar">Magdalena del Mar</option>
                                                <option value="Miraflores">Miraflores</option>
                                                <option value="Pachacamac">Pachacamac</option>
                                                <option value="Pucusana">Pucusana</option>
                                                <option value="Pueblo Libre">Pueblo Libre</option>
                                                <option value="Puente Piedra">Puente Piedra</option>
                                                <option value="Punta Hermosa">Punta Hermosa</option>
                                                <option value="Punta Negra">Punta Negra</option>
                                                <option value="Rimac">Rimac</option>
                                                <option value="San Bartolo">San Bartolo</option>
                                                <option value="San Borja">San Borja</option>
                                                <option value="San Isidro">San Isidro</option>
                                                <option value="San Juan de Lurigancho">San Juan de Lurigancho</option>
                                                <option value="San Juan de Miraflores">San Juan de Miraflores</option>
                                                <option value="San Luis">San Luis</option>
                                                <option value="San Martin de Porres">San Martin de Porres</option>
                                                <option value="San Miguel">San Miguel</option>
                                                <option value="Santa Anita">Santa Anita</option>
                                                <option value="Santa Maria del Mar">Santa Maria del Mar</option>
                                                <option value="Santa Rosa">Santa Rosa</option>
                                                <option value="Santiago de Surco">Santiago de Surco</option>
                                                <option value="Surquillo">Surquillo</option>
                                                <option value="Villa El Salvador">Villa El Salvador</option>
                                                <option value="Villa Maria del Triunfo">Villa Maria del Triunfo</option>
                                            </select>
                                            <label for="distrito">Distrito</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <h6 class="mb-2 d-flex align-items-center">
                                    <i class="bi bi-shield-lock-fill text-primary me-2"></i>
                                    Datos de la cuenta
                                </h6>
                                <div class="alert alert-info d-flex align-items-start py-2" role="alert">
                                    <i class="bi bi-info-circle-fill me-2 mt-1"></i>
                                    <small>Su DNI sera su usuario de acceso.</small>
                                </div>
                                <div class="row g-2">
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <input type="text" class="form-control form-control-sm" id="dni" th:field="*{dni}" placeholder="DNI" required maxlength="8" inputmode="numeric" pattern="[0-9]{8}">
                                            <label for="dni">DNI (sera su usuario)</label>
                                        </div>
                                        <div id="dniHelp" class="form-text">Debe tener exactamente 8 digitos.</div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <input type="password" class="form-control form-control-sm" id="password" name="password" placeholder="Contrasena" required minlength="8">
                                            <label for="password">Contrasena</label>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <input type="password" class="form-control form-control-sm" id="confirmPassword" placeholder="Confirmar contrasena" required minlength="8">
                                            <label for="confirmPassword">Confirmar contrasena</label>
                                        </div>
                                        <div id="passwordHelp" class="form-text"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-3">
                                <button class="btn btn-primary" type="submit">
                                    <i class="bi bi-person-check-fill me-2"></i>Registrarse
                                </button>
                            </div>

                            <div class="text-center mt-3 pt-2 border-top">
                                <p class="text-muted mb-0 small">
                                    Ya tienes una cuenta?
                                    <a th:href="@{/login}" class="text-decoration-none fw-bold">Inicia sesion</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <p class="text-muted small">
                        <i class="bi bi-shield-check me-1"></i>
                        Tus datos estan seguros y protegidos
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/registro.js}"></script>
</body>

</html>
